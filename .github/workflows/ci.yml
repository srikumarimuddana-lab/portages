name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Typecheck, tests, migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portage
          POSTGRES_PASSWORD: portage_ci
          POSTGRES_DB: portage_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      # tsconfig.test.json covers src AND test against the real @types/node.
      # tsconfig.check.json is the offline variant that substitutes a local
      # shim; using it here would collide with the installed type packages.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # Applies every migration to an empty database. Catches ordering
      # mistakes and anything that only works against an already-migrated
      # schema — the class of bug that is invisible locally.
      - name: Migrations apply to a fresh database
        env:
          PGPASSWORD: portage_ci
        run: |
          for f in migrations/*.sql; do
            case "$f" in *.down.sql) continue;; esac
            echo "applying $f"
            psql -h localhost -U portage -d portage_ci -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # The unit tests use a fake Sql, so they prove what the services decide
      # but not that PostgreSQL behaves the way those services assume. These
      # scripts assert the database half directly — partial unique indexes,
      # ON CONFLICT against them, and the publish-guard trigger. They run
      # before the down-migrations, while the schema is still there.
      - name: SQL contracts hold against the real schema
        env:
          PGPASSWORD: portage_ci
        run: |
          for f in test/sql/*.sql; do
            echo "checking $f"
            psql -h localhost -U portage -d portage_ci -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Down-migrations reverse cleanly
        env:
          PGPASSWORD: portage_ci
        run: |
          for f in $(ls -r migrations/*.down.sql 2>/dev/null); do
            echo "reverting $f"
            psql -h localhost -U portage -d portage_ci -v ON_ERROR_STOP=1 -q -f "$f"
          done

          # A down-migration that runs without error has not necessarily
          # reversed anything — a forgotten DROP is silent. Every table a
          # reversible migration created must now be gone. The list is read
          # out of the migrations, so a new one is covered when it lands.
          # Only CREATEd tables: a migration that merely ALTERs an older
          # table correctly leaves it standing.
          created=$(sed -n 's/^CREATE TABLE \(IF NOT EXISTS \)\?\([a-z_][a-z0-9_]*\).*/\2/p' \
            $(ls migrations/*.sql | grep -v '\.down\.sql' | awk -F/ '$2 >= "009"') | sort -u)
          left=""
          for t in $created; do
            n=$(psql -h localhost -U portage -d portage_ci -tAc \
              "SELECT count(*) FROM information_schema.tables
                WHERE table_schema='public' AND table_name='$t'")
            [ "$n" != "0" ] && left="$left $t"
          done
          if [ -n "$left" ]; then
            echo "::error::tables survived their down-migration:$left"
            exit 1
          fi
          echo "checked $(echo "$created" | wc -w) reversible tables"

  secrets:
    name: No secrets in the diff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The scan lives in a script so a contributor can run the same check
      # locally before pushing, rather than discovering it in CI.
      - name: Scan for key material
        run: ./scripts/scan-secrets.sh
